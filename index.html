<script>
const KEY='rcm.v2';

const NS=()=>({cubers:[],rounds:[{id:'r1',name:'Round 1',f:'ao5',times:{}}],cur:'r1',tab:'round',h:{a:'',b:'',r:'all'},res:'overall',sc:DSC(),fin:{a:'',b:'',ta:[],tb:[]}});

const CLOUD=!!(window.RCM_CONFIG&&RCM_CONFIG.url&&window.supabase),UIK=['tab','cur','stage','res','oev','sx','sub','cn','h','tc','insp'];let SB=null,ROLE=null;const LAST={},LASC={},CT={};if(CLOUD){DB={comps:[],pin:'',active:null};SB=supabase.createClient(RCM_CONFIG.url,RCM_CONFIG.key)}

if(CLOUD)ADMIN=false;const UI={page:'home',q:'',cid:null,rt:null,next:null,vm:false,loading:CLOUD,pn:''};
const hash=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return String(h)};

const r2=x=>Math.round(x*100)/100;
// time parsing: 12.34 | 1:02.50 | 9.80+ (+2) | DNF ; undefined = invalid, null = empty
function parse(s){s=(s||'').trim().toUpperCase();if(!s)return null;if(s==='DNF'||s==='D'||s==='-')return Infinity;let p=0;if(s.endsWith('+')){p=2;s=s.slice(0,-1)}let v;if(s.includes(':')){const[m,r]=s.split(':');v=(+m)*60+(+r)}else v=+s;return(isNaN(v)||v<0)?undefined:r2(v+p)}
function fmt(v){if(v==null)return'–';if(v===Infinity)return'DNF';if(v>=60)return Math.floor(v/60)+':'+(v%60).toFixed(2).padStart(5,'0');return v.toFixed(2)}

function stats(a,N=5,cut){let p=(a||[]).slice(0,N).map(parse),cutFail=false;if(cut>0&&isFinite(cut)){const k=N===5?2:1,f=p.slice(0,k);if(f.length===k&&f.every(x=>x!=null&&(x===undefined||x>=cut))){p=f;cutFail=true;N=k}}const ok=p.filter(x=>x!=null),n=ok.length,fin=ok.filter(isFinite);
const best=fin.length?Math.min(...fin):(n?Infinity:null),worst=n?(ok.includes(Infinity)?Infinity:Math.max(...fin)):null;
let mean=null,ao5=null;
if(N===3&&n===3)ao5=ok.includes(Infinity)?Infinity:r2(ok.reduce((x,y)=>x+y)/3);
if(N===5&&n===5){mean=ok.includes(Infinity)?Infinity:r2(ok.reduce((x,y)=>x+y)/5);const m=[...ok].sort(asc).slice(1,4);ao5=m.includes(Infinity)?Infinity:r2(m.reduce((x,y)=>x+y)/3)}
return{p,n,N,cutFail,best,worst,mean,ao5}}
const val=x=>x==null?2e9:x===Infinity?1e9:x;
const cmp=(a,b)=>val(a.ao5)-val(b.ao5)||val(a.best)-val(b.best)||val(a.mean)-val(b.mean);
const rnd=id=>S.rounds.find(r=>r.id===id)||S.rounds[0];
const RS=r=>r.only?S.cubers.filter(c=>r.only.includes(c.id)):S.cubers;
const EVS=['3x3x3 Cube','2x2x2 Cube','4x4x4 Cube','5x5x5 Cube','6x6x6 Cube','7x7x7 Cube','3x3x3 One-Handed','3x3x3 Blindfolded','Pyraminx','Megaminx','Skewb','Square-1','Clock'];
const evOf=r=>r.ev||'3x3x3 Cube',OR=()=>{const e=S.oev||evOf(S.rounds[0]);return S.rounds.filter(r=>evOf(r)===e)};

const NN=r=>r.f==='mo3'?3:5,AL=r=>r.f==='mo3'?'Mo3':'Ao5',ST=(r,c)=>stats(r.times[c],NN(r),parse(r.cutoff||S.sc.cutoff)),IDX=r=>[...Array(NN(r)).keys()];

L.sort((x,y)=>(x.s.n===x.s.N)!==(y.s.n===y.s.N)?(x.s.n===x.s.N?-1:1):cmp(x.s,y.s)||x.c.name.localeCompare(y.c.name));

tail=`<div class="wb">${w?esc(w.name)+' wins!':'Dead heat'}</div><table class="big"><tr><th></th><th>${esc(ca.name)}</th><th>${esc(cb.name)}</th></tr>${T.map(t=>{const hi=t[3],a=hi?t[1]:val(t[1]),b=hi?t[2]:val(t[2]),ga=hi?a>b:a<b,gb=hi?b>a:b<a;return`<tr><td class="n">${t[0]}</td><td class="${ga?'win':''}">${hi?t[1]:fmt(t[1])}</td><td class="${gb?'win':''}">${hi?t[2]:fmt(t[2])}</td></tr>`}).join('')}</table><div class="fe"><button class="b" id="eundo">Undo last solve</button></div>`}
else tail=`<div class="fe"><b>Solve ${k+1}</b> <input class="t" id="ea" placeholder="${esc(ca.name)}" size="9" autocomplete="off"> <input class="t" id="eb" placeholder="${esc(cb.name)}" size="9" autocomplete="off"> <button class="b p" id="eadd">Enter</button> <button class="b" id="eundo">Undo last</button></div>`;
return`<div class="stg"><div class="fh"><div class="nm">${esc(ca.name)}</div><div class="fsc">${wa} – ${wb}</div><div class="nm">${esc(cb.name)}</div></div>${rows}${tail}</div>`}
function vFinal(){const f=S.fin,opt=s=>`<option value="">Choose…</option>`+S.cubers.map(c=>`<option value="${c.id}" ${c.id===s?'selected':''}>${esc(c.name)}</option>`).join('');
return`<div class="card noprint"><h2>Final head to head</h2><div class="bar"><select id="fa">${opt(f.a)}</select><span>vs</span><select id="fb">${opt(f.b)}</select><button class="b" id="top2">Use top 2 of current round</button><button class="b p" id="fgo">Open projector view</button><button class="b d" id="fclr">Reset match</button>${f.bm?'<button class="b" id="bback">Back to bracket</button>':''}</div><p class="hint">Five solves each. Type both times and press Enter (1234 becomes 12.34). The projector view shows each solve as it is entered, the live score, and the full stats once all five are done. The winner is the cuber with the better Average of 5 (best and worst dropped); an exact tie goes to the better single. The live score shows solves won as the match goes.</p></div><div class="card" id="stage">${stage()}</div>`}
function addSolve(){const f=S.fin,a=norm(document.getElementById('ea').value),b=norm(document.getElementById('eb').value),x=parse(a),y=parse(b);if(x==null||y==null)return alert('Enter a valid time for both cubers (like 9.87, 1:02.10 or DNF).');f.ta.push(a);f.tb.push(b);syncBr();save();document.getElementById('stage').innerHTML=stage();const e=document.getElementById('ea');e&&e.focus()}
function sheetsHTML(){const r=rnd(S.cur),c=S.sc,n=NN(r),list=S.cubers.map((x,i)=>({x,id:i+1})).filter(o=>(c.who==='all'||o.x.id===c.who)&&(!r.only||r.only.includes(o.x.id)));
if(!list.length)return'<p class="mute">Add cubers first.</p>';
const row=i=>`<tr><td></td><td class="an">${i}</td><td></td><td></td><td></td></tr>`;
return'<div class="sheets">'+list.map(o=>`<div class="sc"><div class="sct">${esc(c.comp)||'Competition name'}</div><div class="scg"><div><small>Event</small>${esc(evOf(r))}</div><div><small>Round</small>${esc(r.name)}</div><div><small>Group</small>${esc(r.grp&&r.grp[o.x.id]?String(r.grp[o.x.id]):c.group)||'&nbsp;'}</div></div><div class="scg2"><div><small>ID</small><b>${o.id}</b></div><div><small>Competitor name</small><b>${esc(o.x.name)}</b></div><div class="qrc">${qrSvg(location.origin+location.pathname+'#/enter/'+DB.active+'/'+r.id+'/'+o.x.id)}</div></div><table class="st"><tr><th>Scr</th><th>#</th><th>Result</th><th>Judge</th><th>Comp</th></tr>${IDX(r).map(i=>row(i+1)).join('')}<tr class="ex"><td colspan="5">Extra attempt (only if a judge grants it)</td></tr>${row('E')}</table><div class="scf"><div><small>Time limit</small>${esc(r.limit||c.limit)||'&nbsp;'}</div><div><small>Cutoff</small>${esc(r.cutoff||c.cutoff)||'&nbsp;'}</div><div><small>Format</small>${n===3?'Mean of 3':'Average of 5'}</div></div></div>`).join('')+'</div>'}
function vScore(){const c=S.sc;return`<div class="card noprint"><h2>Scorecards</h2><div class="bar"><input class="t" data-sc="comp" placeholder="Competition name" value="${esc(c.comp)}"><input class="t" data-sc="group" placeholder="Group" size="6" value="${esc(c.group)}"><input class="t" data-rs="limit" placeholder="Time limit (this round)" size="14" value="${esc(rnd(S.cur).limit||'')}"><input class="t" data-rs="cutoff" placeholder="Cutoff (this round)" size="14" value="${esc(rnd(S.cur).cutoff||'')}"></div><div class="bar"><select id="rsel">${S.rounds.map(r=>`<option value="${r.id}" ${r.id===S.cur?'selected':''}>${esc(evOf(r))} · ${esc(r.name)}</option>`).join('')}</select><select id="scw"><option value="all">All cubers</option>${S.cubers.map(x=>`<option value="${x.id}" ${c.who===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="b p" onclick="print()">Print scorecards</button></div><p class="hint">One card per cuber for the selected round, with 5 attempts (3 for Mo3 rounds) plus an extra-attempt row. Time limit and cutoff are set per round. Each card has a QR code: scan it to open that competitor's quick-entry page (staff login needed). Cuber IDs follow the order in the Cubers tab. Prints 6 cards per A4 page.</p></div><div id="sheets">${sheetsHTML()}</div>`}
function vCubers(){return`<div class="card"><h2>Cubers</h2><div class="bar"><input class="t" id="newc" placeholder="Cuber name" autocomplete="off"><button class="b p" id="addC">Add cuber</button></div><div class="chips">${S.cubers.map(c=>`<span class="chip">${esc(c.name)}<button data-del="${c.id}" aria-label="Remove ${esc(c.name)}">×</button></span>`).join('')||'<span class="mute">No cubers yet.</span>'}</div><p class="hint">Tip: paste several names separated by commas to add them all at once.</p></div>`}
function vData(){return`<div class="card"><h2>Export and backup</h2><div class="bar"><button class="b p" id="csv">Download results (CSV)</button><button class="b" id="json">Backup (JSON)</button><label class="b">Restore backup<input type="file" id="imp" accept=".json" hidden></label><button class="b d" id="reset">Delete this competition</button></div><p class="hint">Data is stored in this browser on this device. Download a backup before clearing browser data or switching computers. The CSV opens in Excel or Google Sheets.</p></div>`}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function csv(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"',rows=[['Round','Cuber','S1','S2','S3','S4','S5','Best','Worst','Mean','Average','Format','Rank']];
S.rounds.forEach(r=>ranked(r).forEach(x=>{if(x.s.n)rows.push([r.name,x.c.name,...[0,1,2,3,4].map(i=>x.s.p[i]===undefined?'':fmt(x.s.p[i])),fmt(x.s.best),fmt(x.s.worst),fmt(x.s.mean),fmt(x.s.ao5),AL(r),x.rank||''])}));
return rows.map(r=>r.map(q).join(',')).join('\n')}
const app=document.getElementById('app');

app.addEventListener('input',e=>{const t=e.target;if(t.dataset.rs){rnd(S.cur)[t.dataset.rs]=t.value;save();document.getElementById('sheets').innerHTML=sheetsHTML();return}if(t.dataset.sc){S.sc[t.dataset.sc]=t.value;save();document.getElementById('sheets').innerHTML=sheetsHTML();return}if(t.dataset.sch){const q=t.dataset.sch.split(':');S.sched[+q[1]][q[0]]=t.value;save();return}if(t.dataset.c!==undefined){setCell(rnd(S.cur),t.dataset.c,+t.dataset.i,t.value);refresh()}});

app.addEventListener('change',e=>{const id=e.target.id;if(e.target.dataset.ck){ckRow(e.target);return}if(e.target.dataset.nw!==undefined){nowRow(+e.target.dataset.nw);return}if(e.target.dataset.c!==undefined){const t=e.target,v=norm(t.value);if(v!==t.value){t.value=v;setCell(rnd(S.cur),t.dataset.c,+t.dataset.i,v);refresh()}return}
if(id==='rsel'){S.cur=e.target.value;save();render()}
else if(id==='esel'){rnd(S.cur).ev=e.target.value;save();render()}
else if(id==='oev'){S.oev=e.target.value;save();render()}
else if(id==='sx'){S.sx=e.target.value;save();render()}
else if(id==='subx'){S.sub=+e.target.value||10;save();render()}

else if(id==='ha'||id==='hb'||id==='hr'){S.h[id==='ha'?'a':id==='hb'?'b':'r']=e.target.value;save();render()}
else if(id==='ressel'){S.res=e.target.value;save();render()}
else if(id==='imp'){const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.rounds||!d.cubers)throw 0;const cc=DB.comps.find(x=>x.id===DB.active);if(!cc)throw 0;cc.state=d;useComp(cc.id);save();cloudTimes(cc);render()}catch(x){alert('That file is not a valid backup.')}})}});
app.addEventListener('click',e=>{const t=e.target,id=t.id;
if(id==='addR'){const n=prompt('Round name',`Round ${S.rounds.length+1}`);if(n){const r={id:uid(),name:n,f:'ao5',ev:evOf(rnd(S.cur)),times:{}};S.rounds.push(r);S.cur=r.id;save();render()}}
else if(id==='renR'){const r=rnd(S.cur),n=prompt('New name',r.name);if(n){r.name=n;save();render()}}
else if(id==='delR'){if(S.rounds.length<2)return alert('Keep at least one round.');if(confirm('Delete this round and its times?')){S.rounds=S.rounds.filter(r=>r.id!==S.cur);S.cur=S.rounds[0].id;save();render()}}
else if(id==='addC'){const i=document.getElementById('newc');i.value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean).forEach(n=>S.cubers.push({id:uid(),name:n}));save();render();document.getElementById('newc').focus()}
else if(t.dataset.del){const c=S.cubers.find(c=>c.id===t.dataset.del);if(confirm(`Remove ${c.name} and all their times?`)){S.cubers=S.cubers.filter(x=>x!==c);S.rounds.forEach(r=>delete r.times[c.id]);save();cloudTimes(DB.comps.find(x=>x.id===DB.active));render()}}
else if(id==='fs')document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
else if(id==='adv'){const r=rnd(S.cur),L=ranked(r).filter(x=>x.rank);if(!L.length)return alert('Finish this round first.');const n=parseInt(document.getElementById('advn').value)||parseInt(prompt(`How many cubers advance? (${L.length} have full results)`,Math.ceil(L.length/2)));if(n>0){const top=L.filter(x=>x.rank<=n).map(x=>x.c.id),nr={id:uid(),name:`Round ${S.rounds.length+1}`,f:r.f||'ao5',ev:r.ev,only:top,times:{}};S.rounds.push(nr);S.cur=nr.id;save();render()}}
else if(id==='top2'){const L=ranked(rnd(S.cur)).filter(x=>x.rank).slice(0,2);if(L.length<2)return alert('Finish a round with at least two cubers first.');S.fin={a:L[0].c.id,b:L[1].c.id,ta:[],tb:[]};save();render()}
else if(id==='fgo'){const e=document.getElementById('stage');e.requestFullscreen&&e.requestFullscreen()}
else if(id==='fclr'){if(confirm('Clear all solves in this match?')){S.fin.ta=[];S.fin.tb=[];syncBr();save();render()}}

else if(id==='mkg'){const r=rnd(S.cur),n=Math.max(1,parseInt(document.getElementById('ngr').value)||2),ids=RS(r).map(c=>c.id).sort(()=>Math.random()-.5);r.grp={};ids.forEach((c,i)=>r.grp[c]=i%n+1);save();render()}

else if(id==='sgen'){const r=rnd(S.cur),k=Math.min(30,Math.max(1,parseInt(document.getElementById('sgn').value)||1)),ev=evOf(r);if(r.scrs&&!confirm('Replace the existing scrambles for this round?'))return;r.scrs=[...Array(k)].map(()=>[...Array(NN(r)+1)].map(()=>scr(ev)));save();render()}

else if(id==='bback'){S.tab='bracket';save();render()}
else if(t.dataset.bm){const R=brGrid(),k=t.dataset.bm,[lv,j]=k.split('-').map(Number),x=R[lv][j];S.fin={a:x.a,b:x.b,ta:x.m.ta.slice(),tb:x.m.tb.slice(),bm:k};S.tab='final';save();render()}

else if(id==='csv')dl('cube-results.csv',csv(),'text/csv');
else if(id==='json')dl('cube-backup.json',JSON.stringify(S),'application/json');
else if(id==='reset'&&confirm('Delete this competition and all of its data?')){DB.comps=DB.comps.filter(c=>c.id!==DB.active);DB.active=null;S=NS();save();UI.page='comps';render()}});

else if(d.act==='manage'&&ADMIN){useComp(d.cid);S.tab='round';UI.page='admin';render();window.scrollTo(0,0)}

else if(d.act==='delc'&&ADMIN){if(confirm(`Delete "${cm.name}" and all of its results?`)){DB.comps=DB.comps.filter(x=>x!==cm);if(DB.active===cm.id){DB.active=null;S=NS()}save();render()}}
else if(d.act==='export'&&ADMIN)exportPage(d.cid);
else if(id==='newc2'&&ADMIN){const n=prompt('Competition name');if(n){const st=NS();st.sc.comp=n;st.tab='cubers';const c={id:'c'+uid(),name:n,date:today(),status:'running',state:st};DB.comps.push(c);save();useComp(c.id);UI.page='admin';render()}}
else if(id==='lg'&&CLOUD){SB.auth.signInWithPassword({email:document.getElementById('em').value.trim(),password:document.getElementById('pin').value}).then(async r=>{if(r.error)return alert(r.error.message);await setRole(r.data.user.id);if(!ADMIN)return alert('This account is not set up as staff.');await loadAll();UI.page=UI.next||'comps';UI.next=null;render()})}
else if(id==='lg'){const v=document.getElementById('pin').value;if(!DB.pin){if(v.length<4)return alert('Use at least 4 characters.');DB.pin=hash(v);save()}else if(hash(v)!==DB.pin)return alert('Wrong PIN.');ADMIN=true;try{sessionStorage.setItem('rcm.admin','1')}catch(x){}UI.page=UI.next||'comps';UI.next=null;render()}
else if(id==='pin2'&&ADMIN){const v=prompt('New PIN (at least 4 characters)');if(v&&v.length>=4){DB.pin=hash(v);save();alert('PIN updated.')}}
else if(id==='bk'&&ADMIN)dl('rubiks-competitions-backup.json',JSON.stringify(DB),'application/json')});

else if(t.id==='rall'&&ADMIN){const f=t.files[0];if(f)f.text().then(x=>{try{const o=JSON.parse(x);if(!o.comps)throw 0;if(confirm('Replace everything in this browser with the backup?')){DB=o;DB.pin=DB.pin||'';save();render()}}catch(z){alert('That file is not a valid backup.')}})}});
if(CF.title){document.title=CF.title;document.querySelector('.brand h1').textContent=CF.title}if(CF.logo)document.querySelector('.logo').innerHTML='<img alt="" src="'+String(CF.logo).replace(/"/g,'')+'" style="width:100%;height:100%;object-fit:contain">';if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
