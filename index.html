<style>
:root{--bg:#f6f6f3;--card:#fff;--ink:#1c1e24;--mute:#6b707b;--line:#dcdcd6;--acc:#1f5fd6;--ok:#157a3d;--bad:#c62828;--gold:#f2c230;--sil:#c3c8d0;--bro:#d99a63}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--ink:#ecedf0;--mute:#9aa0ab;--line:#31353e;--acc:#6f9cff;--ok:#5fd18a;--bad:#ff7b7b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
.logo{display:grid;grid-template-columns:repeat(3,10px);gap:2px}.logo i{width:10px;height:10px;border-radius:2px}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{border:0;background:none;color:var(--mute);padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--ink);border-color:var(--acc)}
main{max-width:1080px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px;overflow-x:auto}
h2{margin:0 0 12px;font-size:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
button.b,select,input.t{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
button.b{cursor:pointer;font-weight:600}button.b:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.d{color:var(--bad)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--mute);font-weight:600}
td.n,th.n{text-align:left;font-weight:600}
td input{width:76px;text-align:center;font:inherit;padding:6px 4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
td input.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
td.ao{font-size:18px;font-weight:700}
.r1 td:first-child{box-shadow:inset 5px 0 var(--gold)}.r2 td:first-child{box-shadow:inset 5px 0 var(--sil)}.r3 td:first-child{box-shadow:inset 5px 0 var(--bro)}
.win{color:var(--ok);font-weight:700}.mute{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 12px}
.chip button{border:0;background:none;color:var(--bad);cursor:pointer;font-size:16px}
.sum{display:flex;gap:28px;flex-wrap:wrap;font-size:15px;margin-bottom:14px}.sum b{font-size:26px;display:block}
.big td,.big th{font-size:22px;padding:12px 10px}.big td.ao{font-size:30px}
.hint{color:var(--mute);font-size:13px;margin:8px 0 0}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.sc{background:#fff;color:#000;border:1.5px solid #000;padding:10px;font-size:12px;break-inside:avoid}
.sc small{display:block;font-size:10px;color:#444}.sc b{font-size:15px}
.sct{font-weight:700;font-size:14px;text-align:center;border-bottom:1.5px solid #000;padding-bottom:6px;margin-bottom:6px}
.scg,.scf{display:grid;grid-template-columns:1.6fr 1.4fr 1fr;border:1px solid #000;margin-bottom:6px}
.scg2{display:grid;grid-template-columns:64px 1fr;border:1px solid #000;margin-bottom:6px}
.scg>div,.scf>div,.scg2>div{padding:4px 6px;border-right:1px solid #000;min-height:36px;white-space:normal}
.scg>div:last-child,.scf>div:last-child,.scg2>div:last-child{border-right:0}
.sc table.st{width:100%;border-collapse:collapse;margin-bottom:6px}
.st th,.st td{border:1px solid #000;color:#000;height:34px;padding:2px}
.st th{font-size:10px;height:auto;color:#000}.st td.an{width:30px;font-weight:700;text-align:center}
.st tr.ex td{height:auto;font-size:10px;background:#eee;white-space:normal}
.sc table.st tr:last-child>td{border-bottom:1px solid #000}
.stk{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:7px;font-weight:800;background:var(--line);color:var(--ink)}
.r1 .stk{background:var(--gold);color:#000}.r2 .stk{background:var(--sil);color:#000}.r3 .stk{background:var(--bro);color:#000}
td input.over{border-color:#e08a00;background:color-mix(in srgb,#e08a00 18%,var(--bg))}
.pod{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 18px}.pc{flex:1;min-width:190px;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.pn{font-size:22px;font-weight:700;margin-top:6px}.pv{font-size:48px;font-weight:800;line-height:1.1}.pc small{color:var(--mute)}
body.stage{--bg:#000;--card:#0b0b0e;--ink:#fff;--mute:#aeb2bb;--line:#2a2c33;--acc:#ffd500}
body.stage button.p{color:#000}
#stage:fullscreen{background:var(--bg);padding:3vh 4vw;overflow:auto;border:0;border-radius:0}
.stg{text-align:center}.fh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:8px}
.nm{font-size:clamp(24px,5vw,64px);font-weight:800}.fsc{font-size:clamp(40px,9vw,120px);font-weight:800;color:var(--acc)}
.fr{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;border-bottom:1px solid var(--line)}
.ft{font-size:clamp(28px,6vw,80px);font-weight:700;padding:4px}.ft.win{color:var(--ok)}.fn{color:var(--mute);font-size:20px}
.wb{font-size:clamp(30px,6vw,76px);font-weight:800;margin:18px 0;color:var(--gold)}.fe{margin-top:18px;opacity:.9}
.pb{color:var(--ok);font-weight:800;font-size:10px;margin-left:3px}
.hs i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:2px}.hs i.dr{outline:2px dashed var(--mute);outline-offset:-2px;opacity:.55}
td input:disabled{opacity:.35}
#tdisp{font-size:clamp(70px,16vw,200px);font-weight:800;text-align:center;cursor:pointer;user-select:none;line-height:1.1}.scr{font-size:20px;text-align:center;margin:12px 0}
.br{display:flex;gap:26px;align-items:stretch;overflow-x:auto}.bc{display:flex;flex-direction:column;justify-content:space-around;gap:14px;min-width:170px}
.bm{border:1px solid var(--line);border-radius:8px;padding:8px}.bm>div{padding:2px 4px}
.cert{background:#fff;color:#000;border:8px double #333;padding:36px;text-align:center;margin-bottom:16px;min-height:60vh;display:flex;flex-direction:column;justify-content:center;gap:12px}
.c1{font-size:26px;font-weight:700}.c3{font-size:48px;font-weight:800}.c4{font-size:22px}.cert .mute{color:#555}
body{--bg:#f3f4f8}
@media(prefers-color-scheme:dark){body:not(.stage){--bg:#14161a}}
header{position:sticky;top:0;z-index:20;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(0,0,0,.04)}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}.logo{grid-template-columns:repeat(3,11px)}.logo i{width:11px;height:11px}
nav{gap:6px}nav button{border-radius:999px;padding:7px 14px;border:0}nav button:hover{background:var(--line)}nav button.on{background:var(--ink);color:var(--card);border-color:transparent}
main{max-width:1180px}.card,.cc,.role,.pc{box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05)}.card{border-radius:14px;padding:20px}
button.b{border-radius:9px;transition:transform .08s,border-color .15s}button.b:active{transform:scale(.97)}button.p{box-shadow:0 2px 0 rgba(0,0,0,.18)}button.big{padding:12px 22px;font-size:16px}
table tr:nth-child(even) td{background:color-mix(in srgb,var(--ink) 3%,transparent)}th{border-bottom:2px solid var(--line)}
.ctitle{font-size:24px;font-weight:800;margin:0 0 14px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;padding:34px 0 26px}
.hl{font-size:clamp(32px,5.2vw,58px);line-height:1.04;margin:0 0 16px;letter-spacing:-.02em}.hl2{font-size:clamp(26px,4vw,40px);margin:6px 0 14px;letter-spacing:-.01em}

function scr(ev){
if(ev.startsWith('3x3x3')){try{return K.scramble()}catch(e){}}
const ps=(n,F)=>{const o=[];let l='';while(o.length<n){const f=F[rI(F.length)];if(f===l)continue;l=f;o.push(f+["","'"][rI(2)])}return o};

if(ev==='Square-1'){let T=[...'abe'.repeat(4)],B=T.slice();const rot=(L,k)=>L.map((_,i)=>L[(i-k+12)%12]),ok=L=>L[0]!=='b'&&L[6]!=='b',o=[];
while(o.length<11){const a=rI(12)-5,b=rI(12)-5;if(!a&&!b)continue;const t=rot(T,a),u=rot(B,b);if(!ok(t)||!ok(u))continue;T=t;B=u;for(let i=0;i<6;i++){const x=T[i];T[i]=B[i];B[i]=x}o.push(`(${a},${b})`)}return o.join(' / ')}

const n=ev.startsWith('3x3x3')?3:/^[2-7]x/.test(ev)?+ev[0]:0;if(!n)return null;const AXG={U:0,D:0,R:1,L:1,F:2,B:2},fs=n===2?'RUF':'URFDLB',len=[0,0,9,20,40,60,80,100][n],o=[];let l='';

function scrImg(ev,sc){const n=ev.startsWith('3x3x3')?3:/^[2-7]x/.test(ev)?+ev[0]:0;if(!n||!sc)return'';
const h=n-1,N={U:[0,1,0],D:[0,-1,0],R:[1,0,0],L:[-1,0,0],F:[0,0,1],B:[0,0,-1]},C={U:'#ffffff',D:'#ffd500',R:'#c41e3a',L:'#ff5800',F:'#009b48',B:'#0051ba'},AX={U:1,D:1,R:0,L:0,F:2,B:2},sg={U:1,D:-1,R:1,L:-1,F:1,B:-1},O={U:[1,0],L:[0,1],F:[1,1],R:[2,1],B:[3,1],D:[1,2]},st=[];
